<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting...</title>
  <script>
    // GitHub Pages serves 404.html for any unmapped route; redirect with path preserved
    const path = window.location.pathname + window.location.search + window.location.hash;
    const newUrl = 'https://nextfiadvisors.com' + path;
    window.location.replace(newUrl);
  </script>
</head>
<body>
  <p>Redirecting to nextfiadvisors.com...</p>
</body>
</html>
